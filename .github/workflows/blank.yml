name: CI
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 22
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # or 'adopt', depending on your preference
          java-version: '22'

      - name: Build with Maven
        run: mvn clean install -DskipTests=true

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
         login-server: ${{ secrets.ACR_NAME }}.azurecr.io
         username: ${{ secrets.AZURE_CLIENT_ID }}
         password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image to ACR
        run: |
         docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/myapp:${{ github.sha }} .
         docker push ${{ secrets.ACR_NAME }}.azurecr.io/myapp:${{ github.sha }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
            kubectl apply -f deploy/k8s/app-deployment.yaml

         
        
