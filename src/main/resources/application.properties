spring.application.name=KafkaStudy
kafka.regular.topic=my-topic
regular.kafka.autostart=true
reactive.kafka.autostart=false
spring.kafka.bootstrap-servers=kafka-sfs:9092
spring.kafka.consumer.bootstrap-servers=kafka-sfs:9092
spring.kafka.consumer.group-id=demo-31
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.kafka.learn.kafkastudy.config.MyCustomEventDeserializer
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000
spring.data.mongodb.uri=mongodb://mongodb-sfs:27017/mydb
mask.headers.list=pwd,pass
management.endpoints.web.exposure.include = *

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
